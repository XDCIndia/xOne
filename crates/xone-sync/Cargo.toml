[package]
name = "xone-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Sync: the chain manager (XB-13: import, side branches, fork choice, reorg, set-head and restart
# recovery over the traits of xone-db, xone-state and xone-consensus), bootstrap (XA-09: anchor,
# retention, pivot plan) and the XB-14 staged pipeline, follow driver and block files. No clock and no
# global state; the only I/O is the reader and writer a caller passes in.
[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
thiserror.workspace = true
xone-chainspec.workspace = true
xone-consensus.workspace = true
xone-db.workspace = true
xone-executor.workspace = true
xone-primitives.workspace = true
xone-snap.workspace = true
xone-state.workspace = true
# The snapshot container compresses each chunk (XB-18); already in the lock for the node and the harness.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
alloy-trie.workspace = true
proptest.workspace = true
k256.workspace = true
serde.workspace = true
serde_json.workspace = true
# snapstate.rs uses the snap testkit (the same feature xone-snap enables for its own tests)
xone-snap = { workspace = true, features = ["testkit"] }
