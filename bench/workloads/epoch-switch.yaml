# Workload spec. See docs/perf.md section 5. Block ranges are archive ranges on Apothem; status candidate means the exact window is confirmed against the archive before generation.
id: epoch-switch
description: "20 consecutive V2 epoch switches with reward and penalty computation. Epoch length 900 (forks.json xdpos.epoch). V2 switch block 56,828,700 = 63,143 x 900."
network: apothem
chain_id: 51
fork_table_pin: 6fc8e8c2088b7f18264f5663036669d04fa7becf   # crates/xone-chainspec/generated/forks.json
input_hash: ""            # sha256 over the ordered inputs; empty until generated, never edit by hand
input_hash_algo: sha256
generator: {name: "", version: "", sha: ""}   # filled when the generator exists
node_mode: {role: follower, validator_key: none, mining: false, peers: "", sync_mode: "", prune_mode: ""}
durability: {mdbx_sync_mode: "per ADR-005", other_flags: ""}   # copy exact flags into the run record
state: {cache: "", restart_before_run: true}   # warm or cold, declared per run
repeats: 3
tolerance_pct: {p50: 10, p99: 20}   # proposed; owner confirms
metrics: [p50, p95, p99, p99.9, max, throughput, errors, queue_depth, cpu, rss, cgroup_memory, page_cache, io_amplification, network_bytes]
primary_result: "latency of switch blocks versus ordinary blocks; reward and penalty stage time"
load: {model: sequential_replay, note: "unit is per-block import latency; epoch-switch blocks reported separately from ordinary blocks"}
block_ranges:
  - name: post-reward-fork
    from: 84733200          # first multiple of 900 at or after tipProportionalRewardBlock 84,733,000
    to: 84750300            # 84733200 + 19 x 900: 20 switches
    switch_count: 20
    nominal: true           # V2 epoch switches are by round; resolve the real switch blocks from the archive (header with a non-empty validator list) and write the resolved heights and hashes into the run record
    status: candidate
  - name: v2-boundary-optional
    from: 56828700          # V2 switch block
    to: 56845800            # 56828700 + 19 x 900
    switch_count: 20
    nominal: true
    status: optional
generated_inputs: "none, replay of archive blocks"
extra_metrics: [epoch_switch_block_latency_p99, reward_stage_ms, penalty_stage_ms]
