[lints]
workspace = true

# snap/1 (XB-17): the message codec, range proofs over alloy-trie, the server over a state snapshot
# and the client state-sync driver. No I/O, no clock, no threads: the transport (RLPx) and the
# peer set are behind `client::PeerSource`, and every clock reading is an argument.
# Rank: same as xone-net and xone-sync (ci/layering.py), so it depends on neither.
[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
thiserror.workspace = true
xone-primitives.workspace = true
xone-state.workspace = true

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
