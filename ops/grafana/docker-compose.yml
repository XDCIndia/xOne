# Local Prometheus + Grafana for one xOne node: docker compose -f ops/grafana/docker-compose.yml up
# Grafana: http://localhost:3000 (admin/admin on first login), dashboard "xOne overview".
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./xone-overview.json:/var/lib/grafana/dashboards/xone-overview.json:ro
    ports:
      - "3000:3000"
