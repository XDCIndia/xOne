# cargo-deny policy (XB-02 / XA-10). Run: cargo deny --locked check
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore names the advisory, the path and the reason; review it at the next dependency bump.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "k256 0.13 -> crypto-bigint 0.5.5 (xone-primitives, alloy-eip7702 via revm); the fix is crypto-bigint 0.7.6, which k256 0.13 cannot take. Owner review pending (#70)." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained proc-macro pulled in by alloy-primitives; build-time only, no runtime code. Re-check at the next alloy bump." },
]

[licenses]
version = 2
# Our crates are GPL-3.0-or-later; every dependency license below is compatible with it.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (CA list data)
    "ISC", # ring, rustls-webpki, libloading (bindgen of mdbx-sys); permissive, MIT-equivalent
    "MPL-2.0", # libmdbx 0.6.6 and mdbx-sys 13.11.0 (XA-06); file-level copyleft, compatible with GPL-3.0-or-later
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# ADR-002 decision 3: the dependency deny list. Proven by ci/check-deny-fixtures.sh.
# Only reth-ecies and reth-network-peers (git rev, unmodified) may come from reth.
deny = [
    { crate = "reth-eth-wire", reason = "ADR-002: eth/100 and eth/101 framing is ours (xone-net)" },
    { crate = "reth-network", reason = "ADR-002: sessions and peer management are ours (xone-net)" },
    { crate = "reth-trie", reason = "ADR-002: the account leaf carries the wide balance (xone-state)" },
    { crate = "reth-provider", reason = "ADR-002: storage is xone-db" },
    { crate = "reth-evm", reason = "ADR-002: the EVM adapter is xone-evm on revm" },
    { crate = "reth-chainspec", reason = "ADR-002: chain rules are xone-chainspec" },
    { crate = "evm2", reason = "ADR-002: unpublished; revm =43.0.3 is the EVM" },
    # one revm only: two majors in the tree is a different EVM in one binary
    { crate = "revm", deny-multiple-versions = true, reason = "ADR-002: two revm versions fail the check" },
]
wildcards = "deny"
allow-wildcard-paths = true # path dependencies inside the workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# reth is taken by revision (tag v2.3.0) for reth-ecies and reth-network-peers only: crates/xone-net,
# conformance/snap and spikes/net use it. The deny list above refuses every other reth crate.
allow-git = ["https://github.com/paradigmxyz/reth"]
