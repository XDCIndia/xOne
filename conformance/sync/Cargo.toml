[package]
name = "xone-sync-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Follow mode of xone-sync over real xone-net sessions against a loopback geth-XDC. Test tool, not shipped."

[dependencies]
