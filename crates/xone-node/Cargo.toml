[package]
name = "xone-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ADR-007 primitives plus config, datadir marker and the bounded lifecycle (XB-19).
# toml: the config file format. signal-hook: SIGTERM/SIGINT without unsafe code in
# this crate; it is small, has no async runtime, and tokio is not in the tree yet.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
signal-hook.workspace = true
xone-chainspec.workspace = true
# Observability (XB-21), std threads like the rest of this crate. tungstenite: the ethstats
# WebSocket client, sync, handshake only (already in the lock via xone-rpc). rustls with the
# ring provider and webpki-roots: TLS to the stats and heartbeat servers over a plain TcpStream,
# no async runtime. tracing and tracing-subscriber: the subscriber and its rate-limiting layer.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tungstenite = "0.29"
webpki-roots = "1"
