# Workload spec. See docs/perf.md section 5. Block ranges are archive ranges on Apothem; status candidate means the exact window is confirmed against the archive before generation.
id: malformed-traffic
description: "Invalid blocks, transactions and messages: cost of rejection and isolation from the valid path."
network: apothem
chain_id: 51
fork_table_pin: 6fc8e8c2088b7f18264f5663036669d04fa7becf   # crates/xone-chainspec/generated/forks.json
input_hash: ""            # sha256 over the ordered inputs; empty until generated, never edit by hand
input_hash_algo: sha256
generator: {name: "", version: "", sha: ""}   # filled when the generator exists
node_mode: {role: follower, validator_key: none, mining: false, peers: "", sync_mode: "", prune_mode: ""}
durability: {mdbx_sync_mode: "per ADR-005", other_flags: ""}   # copy exact flags into the run record
state: {cache: "", restart_before_run: true}   # warm or cold, declared per run
repeats: 3
tolerance_pct: {p50: 10, p99: 20}   # proposed; owner confirms
metrics: [p50, p95, p99, p99.9, max, throughput, errors, queue_depth, cpu, rss, cgroup_memory, page_cache, io_amplification, network_bytes]
primary_result: "rejection latency by class; valid-path p99 change under attack"
load: {model: open_loop, levels: {below: 0.5, near: 0.9, above: 1.2}, knee_tps: null, soak_h: 1, mix: "valid replay at the near level plus malformed stream at below/near/above"}
block_ranges:
  - {name: valid-background, from: 84333000, to: 84334000, status: candidate, nominal: false}
generated_inputs: "mutated corpus: bad signature, bad RLP, oversized, wrong root, wrong chain id, duplicate, replayed; per-class counts recorded"
extra_metrics: [reject_ms_by_class, valid_path_latency_delta]
