# Local monitoring stack (ops/grafana/docker-compose.yml). Point the target at your node's
# --metrics.addr/--metrics.port.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: xone
    static_configs:
      - targets: ["host.docker.internal:6060"]
