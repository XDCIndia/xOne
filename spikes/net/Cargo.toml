[package]
name = "net-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test-only spike (XA-03, S2). Never shipped. reth's network crates are 0.0.0 placeholders on
# crates.io, so the pin is a git revision: tag v2.3.0, the newest reth tag whose rust-version
# (1.93) the workspace toolchain (1.94.0) accepts. See REPORT.md.
[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
bytes = "1"
futures = "0.3"
reth-ecies = { git = "https://github.com/paradigmxyz/reth", rev = "9384bc53d8c0c77e59cac83fdaaf3b372c6d2216" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", rev = "9384bc53d8c0c77e59cac83fdaaf3b372c6d2216", features = ["secp256k1"] }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context"] }
snap = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "rt", "macros", "time"] }

[dev-dependencies]
serde_json.workspace = true
xone-chainspec.workspace = true
xone-primitives.workspace = true
