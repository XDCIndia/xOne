[workspace]
resolver = "2"
members = ["crates/xone-primitives", "crates/xone-chainspec", "bin/xone", "spikes/wide-balance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
alloy-primitives = { version = "1.7", features = ["serde", "rlp"] }
alloy-rlp = "0.3"
alloy-trie = { version = "0.9", features = ["ethereum"] }
num-bigint = "0.4"
proptest = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xone-primitives = { path = "crates/xone-primitives" }
xone-chainspec = { path = "crates/xone-chainspec" }
