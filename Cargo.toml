[workspace]
resolver = "2"
members = ["crates/xone-primitives", "crates/xone-chainspec", "bin/xone"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
alloy-primitives = { version = "1.7", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-trie = { version = "0.9", features = ["ethereum"] }
clap = { version = "4.6", features = ["derive"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xone-primitives = { path = "crates/xone-primitives" }
xone-chainspec = { path = "crates/xone-chainspec" }
