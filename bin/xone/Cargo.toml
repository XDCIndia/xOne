[package]
name = "xone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
clap.workspace = true
tracing.workspace = true
xone-chainspec.workspace = true
xone-consensus.workspace = true
xone-node.workspace = true
xone-primitives.workspace = true
xone-sync.workspace = true

# jemalloc as the global allocator of the binary only (rule crates keep the system allocator), with
# its background purge thread (#249). A C build; not on MSVC.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", optional = true, features = ["background_threads_runtime_support"] }
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dev-dependencies]
alloy-primitives.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json.workspace = true
