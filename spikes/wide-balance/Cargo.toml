[package]
name = "wide-balance-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["account-ext"]
# Option A: carry the wide balance in revm's AccountInfo extension. Without it only option B is built.
account-ext = ["revm/account-ext"]

[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
revm = { version = "=43.0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
xone-primitives.workspace = true
