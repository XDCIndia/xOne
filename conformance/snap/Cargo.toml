[package]
name = "xone-snap-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-only: xone-snap against xone-sync's pivot plan and against a live geth-XDC over RLPx. Not shipped."

[dependencies]
alloy-primitives.workspace = true
xone-net = { path = "../../crates/xone-net" }
xone-snap.workspace = true
xone-state.workspace = true
xone-sync.workspace = true
xone-primitives.workspace = true
xone-chainspec.workspace = true
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", rev = "9384bc53d8c0c77e59cac83fdaaf3b372c6d2216", features = ["secp256k1"] }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "recovery", "std"] }
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync", "io-util"] }
