name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: miri
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `check` and `assurance` are the required checks of main (branch protection, repo settings).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the pinned toolchain and its components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -I -m unittest discover -s ci/tests -p 'test_*.py'

  # XA-10 / XB-02: the R3 rule checks, each proven by a failing fixture; the release tree check.
  # Every command here is also run locally (docs/assurance/README.md); keep them in step.
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            target
          key: assurance-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: ci/check-fixtures.sh
      - run: python3 -I ci/loc.py --budget ci/loc-budget.toml   # ceilings, issue #201
      - name: Per-crate line and dependency delta
        if: github.event_name == 'pull_request'
        run: python3 -I ci/loc.py --base "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - run: ci/check-layering.sh
      - run: ci/check-layering.sh --fixtures
      - name: Unsafe and FFI table matches the tree
        run: |
          ci/unsafe-audit.sh > "$RUNNER_TEMP/unsafe-audit.md"
          python3 -I ci/unsafe-audit-drift.py "$RUNNER_TEMP/unsafe-audit.md" docs/assurance/unsafe-ffi-audit-2026-11-11.md
      - run: command -v cargo-deny || cargo install cargo-deny --locked --version 0.20.2
      - run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.23.0
      - run: cargo deny --locked check
      - run: ci/check-deny-fixtures.sh   # ADR-002 deny list fires, issue #318
      - run: cargo audit --deny warnings
      - run: RELEASE_TREE_REQUIRE_CLEAN=1 ci/check-release-tree.sh

  # Plan #1 R3 rule 5, primitives part. Nightly is pinned to the date verified locally;
  # raise it deliberately. Unit tests only (--lib): the integration tests read vector files, which
  # miri isolation refuses, and they are untested under miri (about 14 min for --lib locally).
  # Not a PR check: it runs nightly and on demand, bounded to 60 minutes (#203).
  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-03-24 --profile minimal --component miri,rust-src
      - run: cargo +nightly-2026-03-24 miri test -p xone-primitives --lib

  # Mutation testing of the consensus crates, nightly only, 8 shards of at most 60 minutes (issue #15).
  # Surviving mutants are a report (see the artifact), not a failure. Config: mutants.toml.
  mutants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install cargo-mutants --locked --version 25.3.1
      - run: cargo mutants --shard ${{ matrix.shard }}/8 --no-shuffle --timeout 120 || [ $? -eq 2 ]   # 2 = mutants survived
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  # The oracle fork is private. Without the read credential (unset, or a fork PR) this job
  # ends green with a "not qualified" notice; it is NOT a required check, so a green tick here
  # never proves drift. Only a run with the key qualifies the table.
  fork-table-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GETH_XDC_DEPLOY_KEY: ${{ secrets.GETH_XDC_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned oracle read credential
        id: oracle
        run: bash ci/check-oracle-access.sh
      - name: Fetch geth-XDC at conformance/PIN
        if: steps.oracle.outputs.available == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GETH_XDC_DEPLOY_KEY" > ~/.ssh/geth_xdc
          chmod 600 ~/.ssh/geth_xdc
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/geth_xdc -o IdentitiesOnly=yes" conformance/fetch-geth.sh
      - if: steps.oracle.outputs.available == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: conformance/exporter/go.mod
          cache-dependency-path: conformance/exporter/go.sum
      - name: Regenerate and compare
        if: steps.oracle.outputs.available == 'true'
        working-directory: conformance/exporter
        run: |
          go vet ./...
          go run . -check
